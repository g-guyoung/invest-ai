[theme]
primaryColor = "#0092F3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#31333F"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "error"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
headless = true
port = 8501
enableXsrfProtection = true
enableCORS = false
maxMessageSize = 200
runOnSave = true
